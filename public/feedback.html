<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈系统 | 罗文辉个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260528-contact-actions">
</head>
<body class="detail-page feedback-page">
    <header class="site-header">
        <a class="brand" href="index.html">主页</a>
        <button class="nav-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" data-nav-toggle>
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="site-nav" aria-label="反馈系统导航">
            <a href="index.html">简历首页</a>
            <a href="release.html">项目经历</a>
            <a href="rest.html">技能教育</a>
            <a href="player.html">联系方式</a>
            <a href="interview.html">面试邀约</a>
            <a class="is-active" href="feedback.html">反馈系统</a>
            <a href="https://mail.858846.xyz">邮箱系统<span class="external-arrow" aria-hidden="true">↗</span></a>
        </nav>
    </header>

    <main>
        <section class="detail-hero feedback-hero">
            <p class="eyebrow">Feedback System</p>
            <h1>网站反馈与评论</h1>
            <p>这里用于收集对简历网站、项目内容和求职沟通体验的建议。反馈数据会写入数据库，公开评论区仅展示姓名、分类、评分、内容和时间。</p>
        </section>

        <section class="feedback-layout">
            <form class="feedback-form reveal" data-feedback-form>
                <div class="section-heading compact-heading">
                    <p class="eyebrow">New Feedback</p>
                    <h2>提交反馈</h2>
                </div>

                <section class="feedback-group">
                    <div class="feedback-group-title">
                        <h3>基础信息</h3>
                        <span>用于区分反馈来源</span>
                    </div>
                    <div class="feedback-fields feedback-fields-inline">
                        <label>
                            <span>称呼</span>
                            <input name="name" type="text" maxlength="40" autocomplete="name" placeholder="例如：HR / 访客 / 同学">
                        </label>
                        <label>
                            <span>分类</span>
                            <select name="category">
                                <option>网站建议</option>
                                <option>简历内容</option>
                                <option>项目交流</option>
                                <option>招聘沟通</option>
                                <option>其他</option>
                            </select>
                        </label>
                        <label>
                            <span>评分</span>
                            <select name="rating">
                                <option value="5">5 分</option>
                                <option value="4">4 分</option>
                                <option value="3">3 分</option>
                                <option value="2">2 分</option>
                                <option value="1">1 分</option>
                            </select>
                        </label>
                    </div>
                </section>

                <section class="feedback-group">
                    <div class="feedback-group-title">
                        <h3>反馈内容</h3>
                        <span>写清楚问题或建议</span>
                    </div>
                    <div class="feedback-fields">
                        <label>
                            <span>建议或评论</span>
                            <textarea name="comment" maxlength="600" rows="7" required placeholder="写下你对网站、简历内容或项目展示的建议。"></textarea>
                        </label>
                    </div>
                </section>

                <section class="feedback-group">
                    <div class="feedback-group-title">
                        <h3>回访信息</h3>
                        <span>选填，不公开展示</span>
                    </div>
                    <div class="feedback-fields">
                        <label>
                            <span>联系方式</span>
                            <input name="contact" type="text" maxlength="80" autocomplete="off" placeholder="微信 / 邮箱 / 电话均可选填">
                        </label>
                    </div>
                </section>

                <input class="feedback-trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="feedback-actions">
                    <button class="button primary" type="submit">提交反馈</button>
                    <p class="feedback-status" data-feedback-status data-state="muted">提交后会显示在右侧公开评论区。</p>
                </div>
            </form>

            <section class="feedback-list-panel reveal">
                <div class="section-heading compact-heading">
                    <div>
                        <p class="eyebrow">Comments</p>
                        <h2>公开评论</h2>
                    </div>
                    <span class="feedback-count" data-feedback-count>0 条反馈</span>
                </div>
                <div class="comment-list" data-feedback-list>
                    <p class="feedback-empty">正在读取反馈...</p>
                </div>
            </section>
        </section>
    </main>

    <script src="script.js?v=20260527-portfolio-home"></script>
    <script src="feedback.js"></script>
</body>
</html>
