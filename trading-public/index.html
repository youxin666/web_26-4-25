<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#07101f">
  <script data-theme-bootstrap>
    (() => {
      const key = 'trading-theme-preference';
      const allowed = new Set(['auto', 'light', 'dark']);
      let preference = 'auto';
      try {
        const saved = localStorage.getItem(key);
        if (allowed.has(saved)) preference = saved;
      } catch {}
      const systemDark = typeof window.matchMedia === 'function'
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
        : true;
      const resolved = preference === 'auto' ? (systemDark ? 'dark' : 'light') : preference;
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307101f'/%3E%3Cpath d='M13 43l12-15 9 8 17-20v11L35 47l-9-8-13 15z' fill='%2351d7ae'/%3E%3C/svg%3E">
  <title>市场分组概览 · OI Observatory</title>
  <meta name="description" content="基于 Binance USDⓈ-M Futures 公开数据的合约持仓量分组观察面板。">
    <link rel="stylesheet" href="/styles.css?v=20260918-1">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="masthead">
      <div class="identity">
        <span class="eyebrow">DERIVATIVES / OI</span>
        <h1>市场分组概览</h1>
        <p>按实时名义持仓量排序 · USDⓈ-M 永续合约</p>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="主题模式：自动" title="主题模式：自动">
          <span aria-hidden="true" class="theme-toggle-icon">◐</span>
          <span class="theme-toggle-label">自动</span>
        </button>
        <div class="status" id="status" aria-live="polite"><i></i><span>正在同步市场</span></div>
      </div>
    </header>

    <section id="aggregate-view">
    <section class="control-deck" aria-label="榜单设置">
      <div class="segmented" id="rank-controls">
        <span>排行数量</span>
        <button type="button" class="active" data-rank="5">TOP 5</button>
        <button type="button" data-rank="10">TOP 10</button>
      </div>
      <div class="segmented periods" id="period-controls">
        <span>统一周期</span>
        <button type="button" data-period="5m">5m</button><button type="button" data-period="15m">15m</button>
        <button type="button" data-period="30m">30m</button><button type="button" data-period="1h">1h</button>
        <button type="button" class="active" data-period="4h">4h</button><button type="button" data-period="8h">8h</button>
        <button type="button" data-period="12h">12h</button><button type="button" data-period="24h">24h</button>
      </div>
    </section>

    <section class="market-grid" id="market-grid" aria-busy="true"></section>
    <footer><span>Binance USDⓈ-M 单交易所 · 持仓数量滚动变化 · 60 秒刷新</span><span>美元金额为估算名义价值 · 仅供市场观察</span></footer>
    </section>

    <section class="detail-workspace" id="detail-view" hidden aria-labelledby="detail-title">
      <header class="detail-header">
        <div><span class="eyebrow">EVIDENCE DETAIL</span><h2 id="detail-title">BTC 数据详情</h2><p>价格、持仓和主动资金流的多周期证据面板</p></div>
        <div class="coin-switcher" role="tablist" aria-label="看盘币种">
          <button role="tab" aria-selected="true" data-symbol="BTC">BTC</button>
          <button role="tab" aria-selected="false" data-symbol="ETH">ETH</button>
          <button role="tab" aria-selected="false" data-symbol="SOL">SOL</button>
        </div>
      </header>
      <div class="detail-summary" id="detail-summary"></div>
      <div class="detail-main">
        <article class="quadrant-card" id="quadrant-card"></article>
        <section class="period-evidence">
          <div class="direction-strip" id="direction-strip"></div>
          <div class="evidence-charts" id="evidence-charts"></div>
        </section>
      </div>
      <p class="detail-source" id="detail-source"></p>
    </section>

    <section class="panorama-workspace" id="panorama-view" hidden aria-labelledby="panorama-title">
      <header class="panorama-header"><div><span class="eyebrow">MARKET PANORAMA</span><h2 id="panorama-title">币种全景</h2><p>USDⓈ-M 永续合约统一快照 · Binance 基础数据 / Coinalyze 增强</p></div></header>
      <form class="panorama-filters" id="panorama-filters" aria-label="币种筛选">
        <label>搜索<input id="panorama-search" type="search" placeholder="BTC / ETH / SOL" autocomplete="off"></label>
        <label>周期<select id="panorama-period"><option>15m</option><option>30m</option><option>1h</option><option selected>4h</option><option>8h</option><option>12h</option><option>24h</option></select></label>
        <label>数据<select id="panorama-completeness"><option value="all">全部</option><option value="complete">Coinalyze 完整</option><option value="partial">存在缺失</option></select></label>
        <label>OI排名<input data-filter="rankMin" type="number" min="1" placeholder="从"><input data-filter="rankMax" type="number" min="1" placeholder="到"></label>
        <label>价格涨跌%<input data-filter="priceMin" type="number" step="0.1" placeholder="最低"><input data-filter="priceMax" type="number" step="0.1" placeholder="最高"></label>
        <label>OI变化%<input data-filter="oiMin" type="number" step="0.1" placeholder="最低"><input data-filter="oiMax" type="number" step="0.1" placeholder="最高"></label>
        <label>资金费率<input data-filter="fundingMin" type="number" step="0.0001" placeholder="最低"><input data-filter="fundingMax" type="number" step="0.0001" placeholder="最高"></label>
        <label>24H成交量<input data-filter="volumeMin" type="number" placeholder="最低USD"><input data-filter="volumeMax" type="number" placeholder="最高USD"></label>
      </form>
      <div class="panorama-status" id="panorama-status" aria-live="polite">准备加载全景快照</div>
      <div class="panorama-table-shell"><table id="panorama-table"><thead><tr>
        <th data-sort="oiRank" aria-sort="none">排名</th><th data-sort="symbol" aria-sort="none">币种</th><th data-sort="price" aria-sort="none">价格</th><th data-sort="price24hPercent" aria-sort="none">24H涨跌</th><th data-sort="currentOi" aria-sort="descending">当前 OI</th><th data-sort="oiPercent" aria-sort="none">OI变化</th><th data-sort="fundingRate" aria-sort="none">资金费率</th><th data-sort="volume24hUsd" aria-sort="none">24H成交量</th><th>资金流</th><th>多空比</th><th>爆仓</th>
      </tr></thead><tbody></tbody></table></div>
      <aside class="panorama-drawer" id="panorama-drawer" aria-label="币种全景详情" hidden><button id="panorama-close" type="button">← 返回币种列表</button><div id="panorama-detail"></div></aside>
    </section>

    <nav class="workspace-tabs" aria-label="市场工作区">
      <button class="workspace-tab active" data-view="aggregate" aria-selected="true">聚合看板</button>
      <button class="workspace-tab" data-view="detail" aria-selected="false">BTC / ETH / SOL 看盘</button>
      <button class="workspace-tab" data-view="panorama" aria-selected="false">币种全景</button>
    </nav>
  </main>
  <template id="group-template">
    <article class="market-card">
      <div class="card-head"><div><h2></h2><p></p></div><select aria-label="分组周期"></select></div>
      <div class="metric"><span>当前 OI</span><strong></strong></div>
      <div class="delta-row"><span class="period-label"></span><div><b></b><small></small></div></div>
      <div class="flow-row"><span>OI 资金变化</span><b></b></div>
      <div class="divider"></div>
      <p class="list-label"><span class="period-label"></span> OI 增长率 TOP <span class="rank-label"></span></p>
      <ol class="asset-list"></ol>
      <p class="coverage"></p>
    </article>
  </template>
  <script src="/theme-controller.js?v=20260918-1" defer></script>
  <script src="/app.js?v=20260919-1" defer></script>
  <script src="/market-detail-view.js?v=20260918-1" type="module"></script>
  <script src="/panorama-view.js?v=20260919-1" type="module"></script>
</body>
</html>
